
name: Build Huyen Thien Kinh APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Giai nen ma nguon Android
        run: |
          unzip -q HuyenThienKinh_Android_BuildReady.zip -d android-src
          echo "Da giai nen ma nguon"
          find android-src -maxdepth 4 -type f | head -50
      - name: Cai Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tim thu muc Android
        run: |
          PROJECT_DIR="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Khong tim thay settings.gradle"
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Tim thay Android project: $PROJECT_DIR"

      - name: Bien dich APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: HuyenThienKinh-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
